name: Python Checks

on:
  push:
    branches:
      - "main"
      - "releases/**"
    paths:
      - "**.py"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Black formatting
        run: |
          uv run black --check --diff $(git ls-files '*.py')
      - name: Lint
        run: |
          uv run pylint $(git ls-files '*.py')
      - name: MyPy
        run: |
          uv run mypy $(git ls-files '*.py')
      - name: Test
        run: |
          uv run pytest

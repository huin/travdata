[workspace]
resolver = "3"
members = [
  "bin",
  "generic-pipeline",
  "gui",
  "pipeline",
  "testutils",
  "utils",
  "v8wrapper",
]
exclude = ["deps/tabula-rs"]

[workspace.dependencies]
anyhow = "1.0.103"
atomic-write-file = "0.3.0"
borsh = { version = "1.7.0", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
ctrlc = "3.5.2"
egui = "0.35.0"
eframe = { version = "0.35.0", default-features = false, features = [
  "accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
  "default_fonts", # Embed the default egui fonts.
  "glow",          # Use the glow rendering backend. Alternative: "wgpu".
  "persistence",   # Enable restoring app state when restarting the app.
  "wayland",       # To support Linux (and CI)
  "x11",           # To support older Linux distributions (restores one of the default features)
] }
gtk = { version = "0.11.4", package = "gtk4" }
googletest = { version = "0.14.3", features = ["anyhow"] }
hex = "0.4.3"
image = "0.25.10"
hashbrown = { version = "0.17.1", features = ["serde"] }
lazy-regex = { version = "3.6.0", features = ["std"] }
lazy_static = "1.5.0"
log = "0.4.33"
lru = "0.18.0"
map-macro = { version = "0.3.0", features = ["hashbrown"] }
mockall = "0.15.0"
predicates = "3.1.4"
relm4 = "0.11.0"
relm4-components = "0.11.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["std", "serde_derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.150"
serde_v8 = "0.315.0"
serde_yaml_ng = "0.10.0"
sha = "1.0.3"
simple_bar = "0.2.2"
simplelog = { version = "0.12.2", default-features = false }
strum = { version = "0.28.0", features = ["derive", "std", "strum_macros"] }
strum_macros = "0.28.0"
tabula = "0.2.0"
tempfile = "3.27.0"
test-casing = "0.1.3"
test-log = "0.2.21"
thiserror = "2.0.18"
v8 = "149.4.0"
walkdir = "2.5.0"
xdg = "3.0.0"
zip = "8.6.0"

[workspace.dependencies.generic-pipeline]
package = "travdata-generic-pipeline"
path = "generic-pipeline"

[workspace.dependencies.pipeline]
package = "travdata-pipeline"
path = "pipeline"

[workspace.dependencies.testutils]
package = "travdata-testutils"
path = "testutils"

[workspace.dependencies.utils]
package = "travdata-utils"
path = "utils"

[workspace.dependencies.v8wrapper]
package = "travdata-v8wrapper"
path = "v8wrapper"

[workspace.dependencies.pdfium-render]
# TODO: Check if we need to use feature thread_safe. For now we're serialising
# access into a single worker thread.
version = "0.9.2"
default-features = false
# Select the matching pdfium_xxxx feature for the build being linked against.
# Match the image_xxx feature against the `image` crate being used.
features = ["image_025", "pdfium_7763", "static"]
